<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Экспресс-ДЗ — готовые домашние задания</title>
  <meta name="description" content="Экспресс-ДЗ: фотографии с ответами на домашние задания по всем школьным предметам. Выбирай предмет — смотри решение.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <div class="brand">
        <span class="brand-logo" aria-hidden="true">⚡</span>
        <div class="brand-text">
          <h1>Экспресс-ДЗ</h1>
          <p>Ответы на домашку — в один клик</p>
        </div>
      </div>

      <div class="controls">
        <div class="select-wrap">
          <label class="select-label" for="subject-select">Предмет</label>
          <div class="select-box">
            <select id="subject-select" aria-label="Выберите предмет"></select>
            <span class="select-chevron" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
            </span>
          </div>
        </div>
        <button id="choose-btn" class="btn-choose" type="button">Выбрать</button>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="gallery-head">
      <div class="gallery-title-row">
        <h2 id="subject-title">Выберите предмет</h2>
        <span class="count-badge" id="photo-count" hidden></span>
      </div>
    </div>

    <section class="gallery" id="gallery" aria-label="Фотографии с ответами"></section>

    <div class="empty-state" id="empty-state" hidden>
      <div class="empty-icon" aria-hidden="true">📭</div>
      <h3 id="empty-title">ДЗ нет</h3>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
